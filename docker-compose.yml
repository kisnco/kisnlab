# =============================================================================
# KISNLAB — Stack IA locale
# =============================================================================
# Services  : OpenClaw (Discord) · n8n · Postgres+pgvector · Redis · Langfuse · Traefik
# Accès     : http://[service].kisnlab.local
# Prérequis : ajouter les domaines dans /etc/hosts (voir README)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # TRAEFIK — Reverse proxy
  # Accès dashboard : http://traefik.kisnlab.local (auth requise)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.2
    container_name: kisnlab-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.kisnlab.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ---------------------------------------------------------------------------
  # POSTGRES 16 + pgvector — Base unifiée (relationnelle + vectorielle)
  # 3 bases créées automatiquement : openclaw · n8n · langfuse
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kisnlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: "openclaw,n8n,langfuse"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kisnlab-net

  # ---------------------------------------------------------------------------
  # REDIS 7 — Cache + queue pour n8n
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kisnlab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kisnlab-net

  # ---------------------------------------------------------------------------
  # OPENCLAW-DIND — Daemon Docker isolé pour les sandboxes d'OpenClaw
  # Sécurité : remplace l'accès au socket Docker du host. Si OpenClaw est
  # compromis (prompt injection), le blast radius est limité à ce container,
  # pas au Mac. Voir docs/specs/OPENCLAW.md § "Modèle de sécurité".
  # ---------------------------------------------------------------------------
  openclaw-dind:
    image: docker:26-dind
    container_name: kisnlab-openclaw-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ./volumes/openclaw-dind-certs-ca:/certs/ca
      - ./volumes/openclaw-dind-certs-client:/certs/client
      # /var/lib/docker : storage du daemon Docker (overlay2) — NAMED VOLUME OBLIGATOIRE
      # Sur macOS, le bind mount vers ./volumes/ ne supporte pas le chown nécessaire
      # à overlay2 (erreur "failed to Lchown ... permission denied" au pull).
      # Donc on garde ici un named volume Docker-managed (invisible côté macOS).
      # Pour purger le sandbox : `docker volume rm kisnlab_openclaw-dind-data`
      # (après docker compose down).
      - openclaw-dind-data:/var/lib/docker
    networks:
      openclaw-dind-net:
        # alias 'docker' : les certs TLS auto-générés par dind incluent ce nom
        # dans leurs SANs. Connecté via tcp://docker:2376, la vérif TLS passe.
        aliases:
          - docker
    healthcheck:
      test: ["CMD-SHELL", "docker -H tcp://localhost:2376 --tlsverify --tlscacert /certs/server/ca.pem --tlscert /certs/server/cert.pem --tlskey /certs/server/key.pem version >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # OPENCLAW — Agent IA conversationnel (Discord)
  # Accès UI : http://openclaw.kisnlab.local
  # Image    : custom (Dockerfile.openclaw) — base ghcr.io/openclaw pinnée
  #            par digest + docker CLI + gh CLI
  # Docker   : parle à openclaw-dind via TCP+TLS (pas au socket du host)
  # Repo     : monté en lecture seule ; les modifs passent par /workspace/work
  #            et sortent via gh pr create --draft (workflow GitOps)
  # ---------------------------------------------------------------------------
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    image: kisnlab/openclaw:custom
    container_name: kisnlab-openclaw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw-dind:
        condition: service_healthy
    environment:
      # LLM
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Base de données
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openclaw
      # Discord
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_YOUR_USER_ID: ${DISCORD_YOUR_USER_ID}
      # Channels Discord par pôle
      DISCORD_CHANNEL_DEV: ${DISCORD_CHANNEL_DEV}
      DISCORD_CHANNEL_COMMERCIAL: ${DISCORD_CHANNEL_COMMERCIAL}
      DISCORD_CHANNEL_ADMIN: ${DISCORD_CHANNEL_ADMIN}
      DISCORD_CHANNEL_COMM: ${DISCORD_CHANNEL_COMM}
      DISCORD_CHANNEL_STRATEGIE: ${DISCORD_CHANNEL_STRATEGIE}
      DISCORD_CHANNEL_ALERTES: ${DISCORD_CHANNEL_ALERTES}
      DISCORD_CHANNEL_BRIEFS: ${DISCORD_CHANNEL_BRIEFS}
      DISCORD_CHANNEL_LOGS: ${DISCORD_CHANNEL_LOGS}
      # GitHub — gh CLI lit GH_TOKEN nativement (pas besoin de gh auth login)
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GH_TOKEN: ${GITHUB_TOKEN}
      # Docker — parle à openclaw-dind via TLS, pas au socket du host
      # Hostname 'docker' (alias réseau) au lieu de 'openclaw-dind' pour matcher
      # les SANs des certs auto-générés par l'image dind.
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # Workspace
      OPENCLAW_STATE_DIR: /workspace
      OPENCLAW_WEBHOOK_SECRET: ${OPENCLAW_WEBHOOK_SECRET}
      # Observabilité — Langfuse via OTel
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
    volumes:
      - ./config/openclaw:/workspace
      - ./skills:/workspace/skills
      - ./volumes/openclaw:/data
      # Agent workspace (bootstrap files USER.md, SOUL.md, AGENTS.md, etc. injectés
      # dans le system prompt). Bind-mounté pour persister les édits manuels.
      - ./volumes/openclaw-agent-workspace:/home/node/.openclaw/workspace
      # Repo monté en LECTURE SEULE — les modifs passent par /workspace/work + PR GitOps
      - .:/repo/kisnlab:ro
      # Workspace de travail jetable (git clone, build, test) — séparé du repo
      - ./volumes/openclaw-workspace:/workspace/work
      # Certs TLS pour parler à openclaw-dind (read-only)
      - ./volumes/openclaw-dind-certs-client:/certs/client:ro
    networks:
      - kisnlab-net
      - openclaw-dind-net
    # Hardening minimal — les capabilities et limites de ressources réduisent
    # le blast radius en cas de compromission. read_only: true et user override
    # sont volontairement laissés pour une itération hardening dédiée (cf. plan).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`openclaw.kisnlab.local`)"
      - "traefik.http.services.openclaw.loadbalancer.server.port=18789"

  # ---------------------------------------------------------------------------
  # N8N — Workflows déterministes (CRON, webhooks, automatisations)
  # Accès UI : http://n8n.kisnlab.local
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: kisnlab-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Réseau
      N8N_HOST: n8n.kisnlab.local
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.kisnlab.local/
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      # Base Postgres
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Queue Redis
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Auth
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: "false"
      # Discord — webhooks par channel (pas de bot token, évite les conflits gateway)
      DISCORD_WEBHOOK_ALERTES: ${DISCORD_WEBHOOK_ALERTES}
      DISCORD_WEBHOOK_BRIEFS: ${DISCORD_WEBHOOK_BRIEFS}
      DISCORD_WEBHOOK_LOGS: ${DISCORD_WEBHOOK_LOGS}
      DISCORD_WEBHOOK_ADMIN: ${DISCORD_WEBHOOK_ADMIN}
    volumes:
      - ./volumes/n8n:/home/node/.n8n
      - ./workflows:/workflows
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.kisnlab.local`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ---------------------------------------------------------------------------
  # CLICKHOUSE — Moteur analytique pour Langfuse v3
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    container_name: kisnlab-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./volumes/clickhouse:/var/lib/clickhouse
      - ./config/clickhouse/config.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kisnlab-net

  # ---------------------------------------------------------------------------
  # LANGFUSE v3 WEB — Observabilité LLM (tokens, coûts, traces, latence)
  # Accès UI : http://langfuse.kisnlab.local
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: kisnlab-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      NEXTAUTH_URL: http://langfuse.kisnlab.local
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ROLE: VIEWER
      LANGFUSE_INIT_ORG_ID: kisnlab
      LANGFUSE_INIT_ORG_NAME: KisnLab
      LANGFUSE_INIT_PROJECT_ID: kisnlab-main
      LANGFUSE_INIT_PROJECT_NAME: KisnLab
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "disabled"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "disabled"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.kisnlab.local`)"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"

  # ---------------------------------------------------------------------------
  # LANGFUSE v3 WORKER — Traitement asynchrone des traces
  # ---------------------------------------------------------------------------
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: kisnlab-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "disabled"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: "disabled"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "us-east-1"
    networks:
      - kisnlab-net

# =============================================================================
# VOLUMES
# La quasi-totalité des volumes sont des bind mounts vers ./volumes/<name>/
# (visibles depuis macOS, gitignored). Une seule exception : openclaw-dind-data
# qui doit rester un named volume Docker-managed à cause d'overlay2 sur macOS.
#
# Bind mounts dans ./volumes/ :
#   ./volumes/postgres                   → kisnlab-postgres        : /var/lib/postgresql/data
#   ./volumes/redis                      → kisnlab-redis           : /data
#   ./volumes/openclaw                   → kisnlab-openclaw        : /data
#   ./volumes/openclaw-workspace         → kisnlab-openclaw        : /workspace/work
#   ./volumes/openclaw-dind-certs-ca     → kisnlab-openclaw-dind   : /certs/ca
#   ./volumes/openclaw-dind-certs-client → kisnlab-openclaw-dind   : /certs/client
#                                          kisnlab-openclaw        : /certs/client (RO)
#   ./volumes/n8n                        → kisnlab-n8n             : /home/node/.n8n
#   ./volumes/clickhouse                 → kisnlab-clickhouse      : /var/lib/clickhouse
#
# Named volume Docker-managed :
#   openclaw-dind-data → /var/lib/docker (overlay2 storage de la DinD)
# =============================================================================
volumes:
  # Storage du daemon Docker dans la DinD (sandbox d'exécution OpenClaw).
  # Forcément un named volume : overlay2 ne fonctionne pas en bind mount sur macOS.
  # À purger périodiquement : `docker volume rm kisnlab_openclaw-dind-data`
  # (faire `docker compose down openclaw-dind` avant).
  openclaw-dind-data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  kisnlab-net:
    driver: bridge
    name: kisnlab-net
  # Réseau dédié OpenClaw <-> DinD : isolé de kisnlab-net pour éviter la
  # latéralisation depuis la DinD vers postgres, redis, etc.
  openclaw-dind-net:
    driver: bridge
    name: openclaw-dind-net
