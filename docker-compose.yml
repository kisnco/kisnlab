# =============================================================================
# KISNLAB — Stack IA locale
# =============================================================================
# Services  : OpenClaw (Discord) · n8n · Postgres+pgvector · Redis · Langfuse · Traefik
# Accès     : http://[service].kisnlab.local
# Prérequis : ajouter les domaines dans /etc/hosts (voir README)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # TRAEFIK — Reverse proxy
  # Accès dashboard : http://traefik.kisnlab.local (auth requise)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.2
    container_name: kisnlab-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=WARN"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.kisnlab.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ---------------------------------------------------------------------------
  # POSTGRES 16 + pgvector — Base unifiée (relationnelle + vectorielle)
  # 3 bases créées automatiquement : openclaw · n8n · langfuse
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kisnlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_MULTIPLE_DATABASES: "openclaw,n8n,langfuse"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kisnlab-net

  # ---------------------------------------------------------------------------
  # REDIS 7 — Cache + queue pour n8n
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kisnlab-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kisnlab-net

  # ---------------------------------------------------------------------------
  # OPENCLAW — Agent IA conversationnel (Discord)
  # Accès UI : http://openclaw.kisnlab.local
  # ---------------------------------------------------------------------------
  openclaw:
    image: openclaw/openclaw:latest
    container_name: kisnlab-openclaw
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # LLM
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Base de données
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openclaw
      # Discord
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      # Channels Discord par pôle
      DISCORD_CHANNEL_DEV: ${DISCORD_CHANNEL_DEV}
      DISCORD_CHANNEL_COMMERCIAL: ${DISCORD_CHANNEL_COMMERCIAL}
      DISCORD_CHANNEL_ADMIN: ${DISCORD_CHANNEL_ADMIN}
      DISCORD_CHANNEL_COMM: ${DISCORD_CHANNEL_COMM}
      DISCORD_CHANNEL_STRATEGIE: ${DISCORD_CHANNEL_STRATEGIE}
      DISCORD_CHANNEL_ALERTES: ${DISCORD_CHANNEL_ALERTES}
      DISCORD_CHANNEL_BRIEFS: ${DISCORD_CHANNEL_BRIEFS}
      DISCORD_CHANNEL_LOGS: ${DISCORD_CHANNEL_LOGS}
      # Workspace
      OPENCLAW_WORKSPACE: /workspace
    volumes:
      - ./config/openclaw:/workspace
      - ./skills:/workspace/skills
      - openclaw_data:/data
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openclaw.rule=Host(`openclaw.kisnlab.local`)"
      - "traefik.http.services.openclaw.loadbalancer.server.port=18789"

  # ---------------------------------------------------------------------------
  # N8N — Workflows déterministes (CRON, webhooks, automatisations)
  # Accès UI : http://n8n.kisnlab.local
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: kisnlab-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Réseau
      N8N_HOST: n8n.kisnlab.local
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.kisnlab.local/
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      # Base Postgres
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Queue Redis
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Discord (pour que n8n puisse poster dans tes channels)
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.kisnlab.local`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ---------------------------------------------------------------------------
  # LANGFUSE — Observabilité LLM (tokens, coûts, traces, latence)
  # Accès UI : http://langfuse.kisnlab.local
  # ---------------------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:latest
    container_name: kisnlab-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://langfuse.kisnlab.local
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ROLE: VIEWER
    networks:
      - kisnlab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.langfuse.rule=Host(`langfuse.kisnlab.local`)"
      - "traefik.http.services.langfuse.loadbalancer.server.port=3000"

# =============================================================================
# VOLUMES — Données persistantes (survivent aux docker compose down)
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openclaw_data:
    driver: local
  n8n_data:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  kisnlab-net:
    driver: bridge
    name: kisnlab-net
